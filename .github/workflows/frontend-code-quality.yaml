name: Frontend Code Quality
on:
  pull_request:
    branches:
      - development
      - main
jobs:
  check_quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: install dependencies
        run: npm ci

      - name: check code quality
        run: npm run lint
